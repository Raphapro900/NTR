<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Intro</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #introVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #clickOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: rgba(0,0,0,0.55);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: white;
      font-size: 28px;
      text-align: center;
      user-select: none;
    }

    #clickOverlay span {
      background: rgba(255,255,255,0.12);
      padding: 18px 32px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>

  <video id="introVideo" src="intro.mp4" playsinline></video>

  <div id="clickOverlay">
    <span>▶ Haz clic para empezar</span>
  </div>

  <script>
    const introVideo = document.getElementById('introVideo');
    const clickOverlay = document.getElementById('clickOverlay');

    // Al hacer clic → activar audio y reproducir
    clickOverlay.addEventListener('click', async () => {
      clickOverlay.style.display = 'none';
      introVideo.muted = false;
      introVideo.currentTime = 0;
      try {
        await introVideo.play();
      } catch (err) {
        console.log('Error al reproducir:', err);
      }
    });
  </script>
</body>
</html>
